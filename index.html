<!DOCTYPE html>
<html lang="en">

<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<!-- displays site properly based on user's device -->
	<meta name="description" content="A product list app with a cart.">
	<link rel="stylesheet" href="styles.css">
	<link rel="icon" type="image/png" sizes="32x32" href="./assets/images/favicon-32x32.png">

	<title>Frontend Mentor | Product list with cart</title>

</head>

<body>

	<main>
		<article class="dessert-list">

			<h1>Desserts</h1>

			<article class="dessert-card">

				<img src="./assets/images/image-waffle-desktop.jpg" alt="" width="" height="">

				<span class="tag">Waffle</span>

				<h2 class="dessert-name">Waffle with Berries</h2>

				<span class="price">$6.50</span>

				<button>Add to Cart</button>

			</article>

		</article>

		<article class="cart">

			<h2>Your Cart (0)</h2>

			<img src="" alt="" width="" height="">

			<p>Your added items will appear here</p>

		</article>
	</main>

</body>

</html>
